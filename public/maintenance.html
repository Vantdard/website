<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#151513" />
    <title>Vantdard — Maintenance</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #151513;
        color: #fafaf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: clamp(1.25rem, 5vw, 3rem);
      }

      main {
        width: min(100%, 44rem);
        padding-block: clamp(3rem, 10vw, 7rem);
        border-block: 1px solid #44443f;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #8eabff;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 14ch;
        margin: 0 0 1.5rem;
        font-size: clamp(2.5rem, 8vw, 5.25rem);
        line-height: 1;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      p {
        max-width: 38rem;
        margin: 0;
        color: #c9c9c1;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.65;
      }

      a {
        color: #ffffff;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid #8eabff;
        outline-offset: 4px;
      }

      .contact {
        margin-block-start: 2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vantdard</p>
      <h1>We’ll be back soon.</h1>
      <p>
        The Vantdard website is temporarily unavailable while we carry out maintenance.
      </p>
      <p class="contact">
        For support, contact <a href="mailto:hello@vantdard.com">hello@vantdard.com</a>.
      </p>
    </main>
  </body>
</html>
